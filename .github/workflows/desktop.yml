name: Desktop

on:
  pull_request:
    paths:
      - desktop/**
      - cli/src/aerotizen/**
      - cli/tools/build_desktop_worker.py
      - tests/test_desktop_worker.py
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    paths:
      - desktop/**
      - cli/src/aerotizen/**
      - cli/tools/build_desktop_worker.py
      - tests/test_desktop_worker.py
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run format:check && npm run typecheck && npm run lint && npm test && npm run build
        working-directory: desktop
      - run: npx playwright install --with-deps chromium
        working-directory: desktop
      - run: npm run test:browser
        working-directory: desktop

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            bundle: app
            artifact: macos-arm64
          - runner: macos-15-intel
            bundle: app
            artifact: macos-x64
          - runner: windows-2022
            bundle: nsis
            artifact: windows-x64
    runs-on: ${{ matrix.runner }}
    env:
      AEROTIZEN_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install -e '.[dev]' 'pyinstaller>=6.22.1,<7'
      - run: python -m pytest tests/test_desktop_worker.py tests/test_sdb.py tests/test_device_cli.py
      - run: npm ci && npm run worker:build && npm run build
        working-directory: desktop
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        working-directory: desktop
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        working-directory: desktop
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
        working-directory: desktop
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }}
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
