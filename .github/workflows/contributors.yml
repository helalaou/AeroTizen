name: Contributors

# After each merge, refresh the contributor avatars in README.md. When someone new has had
# a pull request merged, open (or update) a pull request with the new list.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the contributor list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/update_contributors.py "$GITHUB_REPOSITORY"
      - name: Open a pull request if it changed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet README.md; then
            echo "Contributors are up to date."
            exit 0
          fi
          branch=bot/update-contributors
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "docs: update contributors"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "docs: update contributors" \
              --body "Adds new contributors to the README, generated by \`tools/update_contributors.py\` after a merge."
          fi
