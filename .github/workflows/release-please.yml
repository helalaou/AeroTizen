name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      cli_created: ${{ steps.release.outputs.release_created }}
      cli_tag: ${{ steps.release.outputs.tag_name }}
      launcher_created: ${{ steps.release.outputs['launcher--release_created'] }}
      launcher_tag: ${{ steps.release.outputs['launcher--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT or GitHub App token also starts CI on release PRs.
          # Asset builds below work with the default token as well.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  cli:
    needs: release-please
    if: needs.release-please.outputs.cli_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    with:
      component: cli
      tag: ${{ needs.release-please.outputs.cli_tag }}

  launcher:
    needs: release-please
    if: needs.release-please.outputs.launcher_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    with:
      component: launcher
      tag: ${{ needs.release-please.outputs.launcher_tag }}
