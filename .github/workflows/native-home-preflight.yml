name: Native HOME source preflight

on:
  push:
    branches:
      - feat/s90c-physical-home-binding

permissions:
  contents: read

jobs:
  native-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run upstream and native HOME contract tests
        run: node --test tests/*.test.cjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Compile native HOME source (no device access)
        run: dotnet build tools/native-home-s90c/S90CHomeBinding.csproj --configuration Release
