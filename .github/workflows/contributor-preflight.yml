name: Contributor preflight

on:
  push:
    branches:
      - feat/v99256-native-home-youtube-live-tv

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: find launcher -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Run upstream and contribution tests
        run: node --test tests/*.test.cjs
