[package]
name = "aerotizen-desktop"
version = "3.1.1"
description = "AeroTizen TV manager"
edition = "2021"
license = "MIT"

[lib]
name = "aerotizen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aerotizen-desktop"
path = "src/main.rs"
required-features = ["desktop-app"]

[features]
desktop-app = []

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }
# Older Tizen Studio profiles can use RC2-encrypted PKCS#12 certificate bags.
openssl-src = { version = "300.6", features = ["legacy"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
form_urlencoded = "1"
getrandom = "0.4"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
subtle = "2"
fs2 = "0.4"
sha2 = "0.10"
native-tls = "0.2"
openssl = { version = "0.10", features = ["vendored"] }
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4", default-features = false }
tokio-native-tls = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
uuid = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy", "multipart"] }
regex = "1"
htmlize = { version = "1.1", default-features = false, features = ["unescape"] }
unicode-general-category = "1.1"
icu_casemap = "2"
rusqlite = { version = "0.42", features = ["bundled"] }
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "lzma"] }
roxmltree = "0.21"
tempfile = "3"
tokio = { version = "1", features = ["time", "io-util", "sync", "net", "macros", "fs"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
rcgen = "0.13"
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }
