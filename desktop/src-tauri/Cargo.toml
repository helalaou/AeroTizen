[package]
name = "aerotizen-desktop"
version = "0.1.0"
description = "AeroTizen TV manager"
edition = "2021"
license = "MIT"

[lib]
name = "aerotizen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
tokio = { version = "1", features = ["process", "time", "io-util", "sync"] }

[dev-dependencies]
tempfile = "3"
