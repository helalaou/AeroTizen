[package]
name = "aerotizen-desktop"
version = "0.1.0"
description = "AeroTizen TV manager"
edition = "2021"
license = "MIT"

[lib]
name = "aerotizen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aerotizen-desktop"
path = "src/main.rs"
required-features = ["bundled-worker"]

[features]
bundled-worker = []
# Enabling the app target here makes Cargo's integration test build replace the standalone binary.
worker-smoke = []

[[test]]
name = "worker_smoke"
path = "tests/worker_smoke.rs"
required-features = ["worker-smoke"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
form_urlencoded = "1"
getrandom = "0.4"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
subtle = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
regex = "1"
htmlize = { version = "1.1", default-features = false, features = ["unescape"] }
unicode-general-category = "1.1"
rusqlite = { version = "0.42", features = ["bundled"] }
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "net", "macros"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }
